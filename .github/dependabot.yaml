version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: tuesday
    time: "07:00"
  commit-message:
    prefix: "TRIVIAL "
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: tuesday
    time: "07:00"
  groups:
    other-dependencies:
      exclude-patterns:
      - "@playwright*"
  commit-message:
    prefix: "TRIVIAL "

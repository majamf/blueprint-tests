name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
  - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: 'Filter selecting which tests to run'
        type: string
      jamfProBaseUrl:
        description: 'URL of the Jamf Pro server'
        type: string
      sboxBaseUrl:
        description: 'URL of the Blueprints standalone deployment'
        type: string
      slack_channel:
        description: 'Slack channel for notifications'
        required: true
        default: 'ocean-tests'
        type: string
      notify_success:
        description: 'Set to true to notify test channel on success'
        default: 'true'
        type: string
      notify_failure:
        description: 'Set to true to notify test channel on failure'
        default: 'true'
        type: string
      test_folder:
        description: 'Select which folder to run tests from'
        default: 'core-blueprints'
        type: string
      rp_project:
        description: 'Report Portal project to send results to'
        default: 'jamf_shared'
        type: string

jobs:
  setup:
    runs-on: [self-hosted, jamf-ubuntu-latest]
    outputs:
      jobs: ${{ steps.define-matrix.outputs.jobs }}
    steps:
      - id: define-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_INPUT: ${{ github.event.inputs.filter || '' }}
          TEST_FOLDER_INPUT: ${{ github.event.inputs.test_folder || 'core-blueprints' }}
          RP_PROJECT_INPUT: ${{ github.event.inputs.rp_project || '' }}
        run: |
          case "$EVENT_NAME" in
            push|schedule)
              jobs='[{"name":"Ocean SBOX","filter":"@sbox","test_folder":"core-blueprints","rp_project":"jamf_capabilities","rp_attributes":"team:ocean,env:sbox"},{"name":"Stage","filter":"@stage","test_folder":"core-blueprints","rp_project":"jamf_capabilities","rp_attributes":"team:ocean,env:stage"}]'
              ;;
            pull_request)
              jobs='[{"name":"All tests","filter":"","test_folder":"core-blueprints","rp_project":"jamf_shared","rp_attributes":"team:ocean"}]'
              ;;
            workflow_dispatch)
              jobs=$(cat <<JSON
          [{"name":"All tests","filter":"${FILTER_INPUT}","test_folder":"${TEST_FOLDER_INPUT}","rp_project":"${RP_PROJECT_INPUT:-jamf_shared}","rp_attributes":""}]
          JSON
              )
              ;;
          esac
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"

  run-playwright:
    name: ${{ matrix.jobs.name }}
    uses: ./.github/workflows/reusable-playwright-setup.yml
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        jobs: ${{ fromJSON(needs.setup.outputs.jobs) }}
    with:
      run-name: ${{ matrix.jobs.name }}
      filter: ${{ matrix.jobs.filter || '' }}
      jamfProBaseUrl: ${{ github.event.inputs.jamfProBaseUrl || '' }}
      sboxBaseUrl: ${{ github.event.inputs.sboxBaseUrl || '' }}
      slack_channel: ${{ github.event.inputs.slack_channel || 'ocean-tests' }}
      notify_success: ${{ github.event.inputs.notify_success || 'true' }}
      notify_failure: ${{ github.event.inputs.notify_failure || 'true' }}
      test_folder: ${{ matrix.jobs.test_folder }}
      rp_project: ${{ matrix.jobs.rp_project }}
      rp_attributes: ${{ matrix.jobs.rp_attributes }}
    secrets:
      JAMF_ACCOUNT_STAGE_USER_MAIL: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_MAIL }}
      JAMF_ACCOUNT_STAGE_USER_PASSWORD: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_PASSWORD }}
      JAMF_PRO_STAGE_API_USERNAME: ${{ secrets.JAMF_PRO_STAGE_API_USERNAME }}
      JAMF_PRO_STAGE_API_PASSWORD: ${{ secrets.JAMF_PRO_STAGE_API_PASSWORD }}
      JAMF_SCHOOL_STAGE_API_USERNAME: ${{ secrets.JAMF_SCHOOL_STAGE_API_USERNAME }}
      JAMF_SCHOOL_STAGE_API_PASSWORD: ${{ secrets.JAMF_SCHOOL_STAGE_API_PASSWORD }}
      RP_API_KEY: ${{ secrets.RP_API_KEY }}
      GH_SLACK_TOKEN: ${{ secrets.GH_SLACK_TOKEN }}

name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      filter:
          description: 'Filter selecting which tests to run'
          required: true
          type: string
jobs:
  test:
    timeout-minutes: 60
    runs-on: jamf-ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.49.0
    steps:
    - name: Git clone the repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set Directory as Safe
      run: |
        git config --system --add safe.directory "$GITHUB_WORKSPACE"
      shell: bash
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        cache: 'pnpm'
        node-version-file: '.nvmrc'
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
    - name: Run Playwright tests
      run: HOME=/root pnpm exec playwright test ${{ github.event.inputs.filter && format('-g {0}', github.event.inputs.filter) || '' }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

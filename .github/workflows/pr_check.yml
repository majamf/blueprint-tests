name: PR checks

on:
  pull_request:

jobs:
  lint:
    runs-on: [self-hosted, jamf-ubuntu-latest]
    name: Lint files
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: |
        pnpm install --frozen-lockfile

    - name: Check formatting
      shell: bash
      run: |
        pnpm lint

  format:
    runs-on: [self-hosted, jamf-ubuntu-latest]
    name: Check formatting
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        shell: bash
        run: |
          pnpm install --frozen-lockfile

      - name: Check formatting
        shell: bash
        run: |
          pnpm format:check
        


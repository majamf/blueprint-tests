name: "Daily Blueprint Cleanup"

on:
  schedule:
  - cron: '0 5 * * *'

env:
  API_GATEWAY_STAGE_CLIENT_ID: ${{ secrets.API_GATEWAY_STAGE_CLIENT_ID }}
  API_GATEWAY_STAGE_CLIENT_SECRET: ${{ secrets.API_GATEWAY_STAGE_CLIENT_SECRET }}

  JAMF_PRO_DEVELOP_STAGE_BASE_URL: ${{ vars.JAMF_PRO_DEVELOP_STAGE_BASE_URL }}
  JAMF_PRO_DEVELOP_STAGE_ACCOUNT_EMAIL: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_MAIL }}
  JAMF_PRO_DEVELOP_STAGE_ACCOUNT_PASSWORD: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_PASSWORD }}
  JAMF_PRO_DEVELOP_STAGE_API_USERNAME: ${{ secrets.JAMF_PRO_STAGE_API_USERNAME }}
  JAMF_PRO_DEVELOP_STAGE_API_PASSWORD: ${{ secrets.JAMF_PRO_STAGE_API_PASSWORD }}

  JAMF_PRO_RC_STAGE_BASE_URL: ${{ vars.JAMF_PRO_RC_STAGE_BASE_URL }}
  JAMF_PRO_RC_STAGE_ACCOUNT_EMAIL: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_MAIL }}
  JAMF_PRO_RC_STAGE_ACCOUNT_PASSWORD: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_PASSWORD }}
  JAMF_PRO_RC_STAGE_API_USERNAME: ${{ secrets.JAMF_PRO_STAGE_API_USERNAME }}
  JAMF_PRO_RC_STAGE_API_PASSWORD: ${{ secrets.JAMF_PRO_STAGE_API_PASSWORD }}

  JAMF_PRO_GA_STAGE_BASE_URL: ${{ vars.JAMF_PRO_GA_STAGE_BASE_URL }}
  JAMF_PRO_GA_STAGE_ACCOUNT_EMAIL: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_MAIL }}
  JAMF_PRO_GA_STAGE_ACCOUNT_PASSWORD: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_PASSWORD }}
  JAMF_PRO_GA_STAGE_API_USERNAME: ${{ secrets.JAMF_PRO_STAGE_API_USERNAME }}
  JAMF_PRO_GA_STAGE_API_PASSWORD: ${{ secrets.JAMF_PRO_STAGE_API_PASSWORD }}

  JAMF_PRO_GA_1_STAGE_BASE_URL: ${{ vars.JAMF_PRO_GA_1_STAGE_BASE_URL }}
  JAMF_PRO_GA_1_STAGE_ACCOUNT_EMAIL: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_MAIL }}
  JAMF_PRO_GA_1_STAGE_ACCOUNT_PASSWORD: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_PASSWORD }}
  JAMF_PRO_GA_1_STAGE_API_USERNAME: ${{ secrets.JAMF_PRO_STAGE_API_USERNAME }}
  JAMF_PRO_GA_1_STAGE_API_PASSWORD: ${{ secrets.JAMF_PRO_STAGE_API_PASSWORD }}

  JAMF_PRO_GA_2_STAGE_BASE_URL: ${{ vars.JAMF_PRO_GA_2_STAGE_BASE_URL }}
  JAMF_PRO_GA_2_STAGE_ACCOUNT_EMAIL: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_MAIL }}
  JAMF_PRO_GA_2_STAGE_ACCOUNT_PASSWORD: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_PASSWORD }}
  JAMF_PRO_GA_2_STAGE_API_USERNAME: ${{ secrets.JAMF_PRO_STAGE_API_USERNAME }}
  JAMF_PRO_GA_2_STAGE_API_PASSWORD: ${{ secrets.JAMF_PRO_STAGE_API_PASSWORD }}


jobs:
  cleanup:
    runs-on: [ self-hosted, jamf-ubuntu-latest ]
    steps:
    - name: Git clone the repository
      uses: actions/checkout@v7
    - name: Setup Deno
      uses: denoland/setup-deno@v2
    - name: Run cleanup script
      id: cleanup
      working-directory: ./cleanup
      run: deno task cleanup

    - name: Send Slack notification on failure
      if: ${{ failure() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
      uses: slackapi/slack-github-action@v2
      with:
        token: ${{ secrets.GH_SLACK_TOKEN }}
        method: chat.postMessage
        payload: |
          {
          "channel": "ocean-tests",
            "attachments": [
              {
                "color": "#FF0000",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Blueprint Cleanup Failed!*"
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "*Blueprint Cleanup Job Failed*\n Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  }
                ]
              }
            ]
          }

name: goldminers-playwright-tests.yml
on:
  push:
    branches: [ main, story/JPCFM-3925-add-playwright-tests-for-cpsc ]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: 'Filter selecting which tests to run'
        type: string
      jamfProBaseUrl:
        description: 'URL of the Jamf Pro server'
        type: string
      sboxBaseUrl:
        description: 'URL of the Blueprints standalone deployment'
        type: string
      slack_channel:
        description: 'Filter selecting which tests to run'
        required: true
        default: 'gm-tests'
        type: string
      notify_success:
        description: 'Set to true to notify on success'
        default: 'false'
        type: string
      notify_failure:
        description: 'Set to true to notify on failure'
        default: 'false'
        type: string
      test_folder:
        description: 'Select which folder to run tests from'
        default: 'config-profiles'
        type: string

env:
  FILTER: ${{ inputs.filter|| '' }}
  JAMF_PRO_BASE_URL: ${{ inputs.jamfProBaseUrl || ''}}
  SBOX_BASE_URL: ${{ inputs.sboxBaseUrl || '' }}
  SLACK_CHANNEL: ${{ inputs.slack_channel || 'gm-tests' }}
  NOTIFY_SUCCESS: ${{ inputs.notify_success || 'false' }}
  NOTIFY_FAILURE: ${{ inputs.notify_failure || 'false' }}
  TEST_FOLDER: ${{ inputs.test_folder || 'config-profiles' }}


jobs:
  setup-playwright-workflow:
    uses: ./.github/workflows/reusable-playwright-setup.yml
    with:
      filter: ${{ env.FILTER}}
      jamfProBaseUrl: ${{ env.JAMF_PRO_BASE_URL }}
      sboxBaseUrl: ${{ env.SBOX_BASE_URL }}
      slack_channel: ${{ env.SLACK_CHANNEL }}
      notify_success: ${{ env.NOTIFY_SUCCESS }}
      notify_failure: ${{ env.NOTIFY_FAILURE }}
      test_folder: ${{ env.TEST_FOLDER }}
    secrets:
      JAMF_ACCOUNT_STAGE_USER_MAIL: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_MAIL }}
      JAMF_ACCOUNT_STAGE_USER_PASSWORD: ${{ secrets.JAMF_ACCOUNT_STAGE_USER_PASSWORD }}
      JAMF_PRO_STAGE_API_USERNAME: ${{ secrets.JAMF_PRO_STAGE_API_USERNAME }}
      JAMF_PRO_STAGE_API_PASSWORD: ${{ secrets.JAMF_PRO_STAGE_API_PASSWORD }}
      JAMF_SCHOOL_STAGE_API_USERNAME: ${{ secrets.JAMF_SCHOOL_STAGE_API_USERNAME }}
      JAMF_SCHOOL_STAGE_API_PASSWORD: ${{ secrets.JAMF_SCHOOL_STAGE_API_PASSWORD }}
      RP_API_KEY: ${{ secrets.RP_API_KEY }}
      GH_SLACK_TOKEN: ${{ secrets.GH_GM_SLACK_TOKEN }}